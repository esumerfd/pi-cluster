---
- name: Monitoring Setup - All Pis
  hosts: all
  become: true

  vars:
    raspi_dash_repo: https://github.com/kristoffersingleton/raspi-dash
    raspi_dash_dir: /opt/raspi-dash
    raspi_dash_port: 8766

  tasks:
    - name: Install raspi-dash dependencies
      apt:
        name:
          - git
          - python3-venv
        state: present
        update_cache: true

    - name: Clone raspi-dash
      git:
        repo: "{{ raspi_dash_repo }}"
        dest: "{{ raspi_dash_dir }}"
        update: true

    - name: Create virtualenv
      command:
        cmd: python3 -m venv {{ raspi_dash_dir }}/venv
        creates: "{{ raspi_dash_dir }}/venv/bin/python"

    - name: Install dependencies into virtualenv
      command:
        cmd: "{{ raspi_dash_dir }}/venv/bin/pip install -r {{ raspi_dash_dir }}/requirements.txt"

    - name: Set raspi-dash directory ownership
      file:
        path: "{{ raspi_dash_dir }}"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_id'] }}"
        recurse: true

    - name: Install raspi-dash systemd service
      template:
        src: templates/raspi-dash.service.j2
        dest: /etc/systemd/system/raspi-dash.service
        mode: "0644"

    - name: Enable and start raspi-dash service
      systemd:
        name: raspi-dash
        enabled: true
        state: restarted
        daemon_reload: true

- name: Monitoring Setup - Control node only
  hosts: control
  become: true

  vars:
    dashboard_repo: https://github.com/kristoffersingleton/RPI-Hailo-10H-Web-Dashboard
    dashboard_dir: /opt/hailo-dashboard
    dashboard_port: 8765
    dashboard_user: "{{ ansible_facts['user_id'] }}"

  tasks:
    # Hailo Web Dashboard
    - name: Install dashboard dependencies
      apt:
        name:
          - git
          - python3-flask
        state: present
        update_cache: true

    - name: Clone Hailo web dashboard
      git:
        repo: "{{ dashboard_repo }}"
        dest: "{{ dashboard_dir }}"
        update: true

    - name: Set dashboard directory ownership
      file:
        path: "{{ dashboard_dir }}"
        owner: "{{ dashboard_user }}"
        group: "{{ dashboard_user }}"
        recurse: true

    - name: Install hailo-dashboard systemd service
      template:
        src: templates/hailo-dashboard.service.j2
        dest: /etc/systemd/system/hailo-dashboard.service
        mode: "0644"

    - name: Enable and start hailo-dashboard service
      systemd:
        name: hailo-dashboard
        enabled: true
        state: restarted
        daemon_reload: true
