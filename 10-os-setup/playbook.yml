---
- name: OS Setup - All Pis
  hosts: all
  become: true

  vars:
    wifi_country: US

  vars_files:
    - vars/secrets.yml

  tasks:
    - name: Remove auto-generated netplan files that override our config
      shell: find /etc/netplan -name '90-NM-*.yaml' -delete
      register: eth0_config

    - name: Deploy eth0 netplan config (DHCP, optional)
      template:
        src: templates/eth0.yaml.j2
        dest: /etc/netplan/90-eth0.yaml
        mode: "0600"

    - name: Set WiFi country code
      command: raspi-config nonint do_wifi_country "{{ wifi_country }}"

    - name: Unblock WiFi radio
      command: rfkill unblock wifi

    - name: Deploy WiFi netplan config
      template:
        src: templates/wifi.yaml.j2
        dest: /etc/netplan/60-wifi.yaml
        mode: "0600"
      register: wifi_config

    - name: Configure avahi to advertise only on wlan0
      template:
        src: templates/avahi-daemon.conf.j2
        dest: /etc/avahi/avahi-daemon.conf
        mode: "0644"

    - name: Apply netplan if config changed
      command: netplan apply
      when: wifi_config.changed or eth0_config.changed

    - name: Wait for connection to recover after netplan apply
      wait_for_connection:
        delay: 5
        timeout: 60
      when: wifi_config.changed or eth0_config.changed


    - name: Install tools
      apt:
        name:
          - lsof
          - jq
          - avahi-daemon
        state: present
        update_cache: true

    - name: Set hostname
      hostname:
        name: "{{ inventory_hostname }}"

    - name: Enable and start avahi-daemon
      systemd:
        name: avahi-daemon
        enabled: true
        state: started

    - name: Clear motd
      copy:
        content: ""
        dest: /etc/motd

    - name: Suppress wifi-check warning
      file:
        path: /etc/profile.d/wifi-check.sh
        state: absent

    - name: Revert pam_motd to noupdate
      lineinfile:
        path: /etc/pam.d/sshd
        regexp: "^session.*pam_motd.so motd=/etc/motd"
        line: "session    optional     pam_motd.so noupdate"

    - name: Deploy shell config
      template:
        src: templates/shell_config.sh.j2
        dest: /etc/profile.d/cluster.sh
        mode: "0644"

    - name: Set PS1 in .bashrc
      become: false
      lineinfile:
        path: "~/.bashrc"
        line: "PS1='\\[\\033[01;32m\\]\\h\\[\\033[00m\\] \\[\\033[01;34m\\]\\W\\[\\033[00m\\]: '"
        regexp: "^PS1=.*cluster.*"
        insertafter: EOF

  handlers:
    - name: Restart avahi-daemon
      systemd:
        name: avahi-daemon
        state: restarted

    - name: Restart sshd
      systemd:
        name: sshd
        state: restarted

- name: OS Setup - Control node only
  hosts: control
  become: true

  tasks:
    # Enable PCIe Gen 3 for Hailo-10H (Pi 5 is Gen 2 certified but Gen 3 capable)
    - name: Enable PCIe Gen 3.0 in config.txt
      lineinfile:
        path: /boot/firmware/config.txt
        line: "dtparam=pciex1_gen=3"
      register: pcie_config

    - name: Reboot if PCIe config changed
      reboot:
        reboot_timeout: 120
      when: pcie_config.changed
