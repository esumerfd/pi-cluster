---
- name: OS Setup - All Pis
  hosts: all
  become: true

  tasks:
    - name: Set vi mode in bashrc
      lineinfile:
        path: "/home/{{ ansible_user }}/.bashrc"
        line: "set -o vi"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

- name: OS Setup - Control node only
  hosts: control
  become: true

  tasks:
    # Enable PCIe Gen 3 for Hailo-10H (Pi 5 is Gen 2 certified but Gen 3 capable)
    - name: Enable PCIe Gen 3.0 in config.txt
      lineinfile:
        path: /boot/firmware/config.txt
        line: "dtparam=pciex1_gen=3"

- name: Reboot all Pis
  hosts: all
  become: true

  tasks:
    - name: Reboot Pi
      reboot:
        reboot_timeout: 120
