---
- name: Hailo Installation - Control node only
  hosts: control
  become: true

  tasks:
    # Step 3a: Install Hailo software
    - name: Install required packages
      apt:
        name:
          - dkms
          - hailo-h10-all
        state: present
        update_cache: true

    # Step 3b: Blacklist built-in hailo_pci (Hailo-8) driver so hailo1x_pci (Hailo-10H) can load cleanly
    - name: Blacklist hailo_pci kernel module
      copy:
        dest: /etc/modprobe.d/hailo-blacklist.conf
        content: "blacklist hailo_pci\n"

    # Step 3c: Reboot
    - name: Reboot Pi
      reboot:
        reboot_timeout: 120

    # Step 3c: Verify installation
    - name: Verify Hailo device
      command: hailortcli fw-control identify
      register: hailo_identify
      changed_when: false

    - name: Show Hailo identification
      debug:
        var: hailo_identify.stdout_lines

    # Step 3d: Check kernel logs
    - name: Check dmesg for Hailo
      shell: dmesg | grep -i hailo
      register: hailo_dmesg
      changed_when: false
      failed_when: false

    - name: Show Hailo kernel logs
      debug:
        var: hailo_dmesg.stdout_lines
